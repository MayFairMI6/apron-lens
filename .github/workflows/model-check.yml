name: Qwen development check
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Development suite (never runs fresh held-out tests)
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - dev
permissions:
  contents: read
concurrency:
  group: qwen-local-runner
  cancel-in-progress: false
jobs:
  model:
    # Configure a trusted Mac runner with this custom label before dispatching.
    # No pull_request/push triggers on the personal machine.
    runs-on: [self-hosted, macOS, ARM64, airfield-qwen]
    timeout-minutes: 45
    env:
      AIRFIELD_QWEN_PYTHON: ${{ vars.AIRFIELD_QWEN_PYTHON }}
      AIRFIELD_MODEL_CACHE: ${{ vars.AIRFIELD_MODEL_CACHE }}
      AIRFIELD_CHECK_SUITE: ${{ inputs.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check configured runtime and attach pinned local weights
        run: |
          test -n "$AIRFIELD_QWEN_PYTHON" && test -x "$AIRFIELD_QWEN_PYTHON"
          test -n "$AIRFIELD_MODEL_CACHE"
          "$AIRFIELD_QWEN_PYTHON" scripts/prepare_model_runner.py --model-cache "$AIRFIELD_MODEL_CACHE"
      - name: Run development checks with the real model
        run: '"$AIRFIELD_QWEN_PYTHON" scripts/run_model_check.py --suite "$AIRFIELD_CHECK_SUITE" --output work/model-ci'
      - name: Save model run as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qwen-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/model-ci/
          if-no-files-found: warn
          retention-days: 30
